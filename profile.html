<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>درگاه پرداخت امانی فروشنده</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px 12px 60px;
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 22px 18px; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .profile-header { text-align: center; }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--primary-light); color: var(--primary);
      display: grid; place-items: center; margin: 0 auto 10px;
      font-size: 26px; border: 2px solid #bfdbfe;
    }
    .store-name { font-size: 18px; font-weight: 800; margin: 0 0 6px; }
    .badge-verified {
      display: inline-flex; align-items: center; gap: 4px;
      background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .stats-row {
      display: flex; justify-content: space-around;
      background: #f8fafc; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin: 16px 0; text-align: center;
    }
    .stat-val { font-size: 16px; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .field { margin-bottom: 12px; text-align: right; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 12px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; background: #f8fafc;
    }
    .field input:focus { border-color: var(--primary); background: #fff; }
    .btn-pay {
      width: 100%; padding: 14px; background: var(--primary); color: #fff;
      font-weight: 800; font-size: 15px; border: none; border-radius: 12px;
      cursor: pointer; font-family: inherit; margin-top: 10px;
    }
    .error-box { text-align: center; padding: 40px 15px; color: #dc2626; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  
  <div id="loading" style="text-align:center; padding:30px; color:var(--muted); font-size:13px;">
    در حال استعلام هویت فروشنده از سامانه...
  </div>

  <div id="errorView" class="card error-box" style="display:none;"></div>

  <div id="profileView" style="display:none;" class="container">
    
    <div class="card profile-header">
      <div class="avatar" id="avatarText">🛍️</div>
      <h2 class="store-name" id="sellerTitle">---</h2>
      <div id="verifiedBadge" class="badge-verified">
        ✓ فروشنده احراز هویت شده در سامانه
      </div>

      <div class="stats-row">
        <div>
          <div class="stat-val" id="dealsCount">۰</div>
          <div class="stat-lbl">معاملات موفق ثبت‌شده</div>
        </div>
        <div>
          <div class="stat-val">۲۴ ساعت</div>
          <div class="stat-lbl">مهلت تست تضمینی</div>
        </div>
        <div>
          <div class="stat-val">امانی (Escrow)</div>
          <div class="stat-lbl">روش پرداخت</div>
        </div>
      </div>

      <p style="font-size:12px; color:var(--muted); margin:0; line-height:1.6;">
        وجه شما تا تحویل کالا و تایید رضایت در حساب امن سامانه نگهداری می‌شود.
      </p>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px; font-size:15px; text-align:center;">ثبت سفارش و پرداخت امن به این فروشنده</h3>

      <div class="field">
        <label>کالا یا خدمت توافق‌شده:</label>
        <input type="text" id="orderTitle" placeholder="مثال: قاب گوشی، کفش، طراحی بنر">
      </div>

      <div class="field">
        <label>مبلغ معامله (تومان):</label>
        <input type="number" id="orderAmount" placeholder="مبلغ توافق‌شده">
      </div>

      <div class="field">
        <label>شماره موبایل شما (خریدار):</label>
        <input type="tel" id="buyerPhone" placeholder="09xxxxxxxxx" maxlength="11">
      </div>

      <button class="btn-pay" onclick="submitDirectOrder()">ورود به مرحله پرداخت امن</button>
    </div>

  </div>

</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const sellerQuery = urlParams.get('id') || urlParams.get('phone');
  let currentSeller = null;

  async function loadSellerProfile() {
    if (!sellerQuery) {
      showError('شناسه یا شماره فروشنده‌ای در آدرس مشخص نشده است.');
      return;
    }

    try {
      const res = await fetch(`/api/profile?id=${sellerQuery}`);
      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || 'فروشنده‌ای با این اطلاعات یافت نشد.');
        return;
      }

      currentSeller = data.seller;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('profileView').style.display = 'flex';

      document.getElementById('sellerTitle').innerText = currentSeller.name;
      document.title = `${currentSeller.name} | پرداخت امن`;
      document.getElementById('avatarText').innerText = currentSeller.name.charAt(0);
      document.getElementById('dealsCount').innerText = currentSeller.deals_count;

    } catch (e) {
      showError('خطا در برقراری ارتباط با پایگاه داده سامانه.');
    }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const errBox = document.getElementById('errorView');
    errBox.style.display = 'block';
    errBox.innerHTML = `⚠️ <b>خطا:</b> ${msg}<br><br><a href="/" style="font-size:12px; color:#2563eb;">بازگشت به صفحه اصلی</a>`;
  }

  async function submitDirectOrder() {
    const title = document.getElementById('orderTitle').value.trim();
    const amount = document.getElementById('orderAmount').value.trim();
    const buyerPhone = document.getElementById('buyerPhone').value.trim();

    if (!title || !amount || buyerPhone.length !== 11) {
      alert('لطفاً عنوان کالا، مبلغ و شماره موبایل ۱۱ رقمی خود را وارد کنید.');
      return;
    }

    const payload = {
      title: `${currentSeller.name} - ${title}`,
      amount: amount,
      buyer_phone: buyerPhone,
      seller_phone: currentSeller.phone,
      seller_sheba: currentSeller.sheba || 'IR920170000000105324139001',
      fee_payer: 'buyer'
    };

    try {
      const res = await fetch('/api/deals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success && data.dealId) {
        window.location.href = `/deal.html#${data.dealId}`;
      } else {
        alert('خطا در ثبت سفارش: ' + (data.error || ''));
      }
    } catch(e) {
      alert('خطا در برقراری ارتباط با سرور.');
    }
  }

  loadSellerProfile();
</script>

</body>
</html>
