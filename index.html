<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واسطه پرداخت امن</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .card { max-width: 500px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #222; text-align: center; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
    button { background: #0066cc; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
    button:hover { background: #0052a3; }
    .status { margin-top: 15px; padding: 15px; background: #eef6ff; border-radius: 8px; display: none; line-height: 1.8; text-align: center; }
    .deal-btn { display: block; margin-top: 10px; padding: 12px 18px; background: #28a745; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; }
    .deal-btn:hover { background: #218838; }
    .copy-btn { background: #6c757d; font-size: 13px; padding: 8px; margin-top: 8px; }
  </style>
</head>
<body>

<div class="card">
  <h2>ایجاد معامله امن جدید</h2>
  <input type="text" id="title" placeholder="عنوان معامله (مثال: اکانت بازی، طراحی، کالا)">
  <input type="number" id="amount" placeholder="مبلغ معامله (تومان)">
  <input type="tel" id="buyer_phone" placeholder="شماره موبایل خریدار">
  <input type="tel" id="seller_phone" placeholder="شماره موبایل فروشنده">
  <input type="text" id="seller_sheba" placeholder="شماره شبای فروشنده (جهت تسویه)">
  
  <select id="fee_payer">
    <option value="buyer">کارمزد ۳٪ بر عهده خریدار</option>
    <option value="seller">کارمزد ۳٪ کسر از فروشنده</option>
    <option value="split">کارمزد بالمناصفه (۵۰-۵۰)</option>
  </select>

  <button onclick="createDeal()">ثبت و ساخت لینک پرداخت امن</button>
  <div id="result" class="status"></div>
</div>

<script>
  async function createDeal() {
    const title = document.getElementById('title').value;
    const amount = document.getElementById('amount').value;
    const buyer_phone = document.getElementById('buyer_phone').value;
    const seller_phone = document.getElementById('seller_phone').value;
    const seller_sheba = document.getElementById('seller_sheba').value;
    const fee_payer = document.getElementById('fee_payer').value;
    const box = document.getElementById('result');

    if(!title || !amount) {
      alert('لطفاً عنوان و مبلغ را وارد کنید');
      return;
    }

    box.style.display = 'block';
    box.innerText = 'در حال ثبت در سرور...';

    try {
      const response = await fetch('/api/deals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, amount, buyer_phone, seller_phone, seller_sheba, fee_payer })
      });

      const res = await response.json();

      if(res.success && res.dealId) {
        const dealUrl = window.location.origin + '/deal.html?id=' + encodeURIComponent(res.dealId);

        box.innerHTML = `
          ✅ <b>معامله با موفقیت ثبت شد!</b><br>
          <b>شناسه:</b> <code>${res.dealId}</code><br><br>
          <a class="deal-btn" href="${dealUrl}">ورود به صفحه پرداخت و رهگیری معامله</a>
          <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText('${dealUrl}'); alert('لینک کپی شد!');">📋 کپی لینک معامله برای ارسال به طرفین</button>
        `;
      } else {
        box.innerText = 'خطا در ثبت: ' + (res.error || 'مشکلی رخ داد');
      }
    } catch(err) {
      box.innerText = 'خطا در برقراری ارتباط با سرور کلودفلر';
    }
  }
</script>

</body>
</html>
