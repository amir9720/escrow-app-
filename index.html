<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>درگاه پرداخت و معامله امن واسطه (Escrow)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background: var(--bg); margin: 0; padding: 16px 12px 60px; color: var(--text);
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; padding: 14px 18px; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .brand { font-size: 15px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .btn-header {
      background: #eff6ff; color: var(--primary); text-decoration: none;
      font-size: 12px; font-weight: bold; padding: 8px 12px; border-radius: 8px; border: 1px solid #bfdbfe;
    }

    .card {
      background: var(--card); border-radius: var(--radius);
      padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .card-title { font-size: 17px; font-weight: 800; margin: 0 0 6px; text-align: center; }
    .card-subtitle { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 18px; }

    .field { margin-bottom: 14px; text-align: right; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
    .field input, .field select {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; background: #fff;
    }
    .field input:focus, .field select:focus { border-color: var(--primary); }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 10px;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-box {
      background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 22px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); text-align: center;
    }
    .otp-input {
      font-size: 24px; letter-spacing: 12px; text-align: center; font-weight: 800;
      padding: 10px; width: 180px; margin: 16px auto; border: 2px solid var(--primary);
      border-radius: 10px; font-family: monospace; display: block;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header-bar">
    <div class="brand">
      <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>واسطه پرداخت امن</span>
    </div>
    <a href="/seller.html" class="btn-header">📦 پنل فروشگاه من</a>
  </div>

  <div class="card">
    <h2 class="card-title">ایجاد لینک فروش امن (ویژه فروشندگان)</h2>
    <div class="card-subtitle">مشخصات کالایتان را ثبت کنید تا لینک اختصاصی خرید برای مشتری تولید شود.</div>

    <div class="field">
      <label>عنوان کالا یا سفارش:</label>
      <input type="text" id="dealTitle" placeholder="مثال: گوشی آیفون 13، طراحی لوگو...">
    </div>

    <div class="field">
      <label>مبلغ پرداختی مشتری (تومان):</label>
      <input type="number" id="dealAmount" placeholder="مثال: 3500000">
    </div>

    <div class="field">
      <label>شماره موبایل شما (فروشنده):</label>
      <input type="tel" id="sellerPhone" placeholder="09xxxxxxxxx" maxlength="11">
    </div>

    <div class="field">
      <label>کد ملی فروشنده (جهت احراز هویت شاهکار):</label>
      <input type="tel" id="nationalIdInput" placeholder="۱۰ رقم بدون خط تیره" maxlength="10">
    </div>

    <div class="field">
      <label>شماره شبای بانکی شما (جهت تسویه و واریز پول):</label>
      <input type="text" id="sellerSheba" placeholder="IRxxxxxxxxxxxxxxxxxxxxxxxx" maxlength="26">
    </div>

    <div class="field">
      <label>پرداخت‌کننده کارمزد ۳٪ واسطه:</label>
      <select id="feePayer">
        <option value="buyer">خریدار می‌پردازد (به فاکتور خریدار اضافه شود)</option>
        <option value="seller">فروشنده می‌پردازد (از سهم تسویه من کسر شود)</option>
        <option value="split">المناصفه (۵۰-۵۰ بین طرفین)</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btnSubmitDeal" onclick="handleStartDeal()">
      ایجاد لینک اختصاصی خرید امن
    </button>
  </div>

  <div style="text-align: center; margin-top: 10px; font-size: 13px;">
    <a href="/rules.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">
      📜 قوانین، مهلت تست و نحوه تسویه وجه
    </a>
  </div>

</div>

<!-- پنجره تایید پیامک -->
<div class="modal-overlay" id="otpModal">
  <div class="modal-box">
    <h3 style="margin:0 0 8px; font-size:16px;">تایید شماره تماس فروشنده</h3>
    <p style="font-size:12px; color:var(--muted); margin:0 0 10px;" id="otpDesc">کد ۴ رقمی پیامک شده را وارد کنید:</p>

    <input type="tel" class="otp-input" id="otpCodeInput" maxlength="4" placeholder="••••">

    <button class="btn btn-primary" onclick="verifyAndCreateDeal()">تایید و دریافت لینک خرید</button>
    <button class="btn" style="background:#e2e8f0; color:#334155; margin-top:8px;" onclick="closeOtpModal()">انصراف</button>
  </div>
</div>

<script>
  function checkNationalId(code) {
    if (!code || !/^\d{10}$/.test(code)) return false;
    if (/^(\d)\1{9}$/.test(code)) return false;
    const check = parseInt(code[9], 10);
    let sum = 0;
    for (let i = 0; i < 9; i++) {
      sum += parseInt(code[i], 10) * (10 - i);
    }
    const rem = sum % 11;
    return (rem < 2 && check === rem) || (rem >= 2 && check === 11 - rem);
  }

  async function handleStartDeal() {
    const title = document.getElementById('dealTitle').value.trim();
    const amount = document.getElementById('dealAmount').value.trim();
    const sellerPhone = document.getElementById('sellerPhone').value.trim();
    const nationalId = document.getElementById('nationalIdInput').value.trim();
    const sellerSheba = document.getElementById('sellerSheba').value.trim();

    if (!title || !amount || !sellerPhone || !nationalId || !sellerSheba) {
      alert('لطفاً تمام مشخصات کالا و اطلاعات بانکی را تکمیل کنید.');
      return;
    }

    if (!/^09\d{9}$/.test(sellerPhone)) {
      alert('شماره موبایل وارد شده باید ۱۱ رقمی باشد.');
      return;
    }

    if (!checkNationalId(nationalId)) {
      alert('کد ملی وارد شده طبق الگوریتم رسمی کشور نامعتبر است.');
      return;
    }

    const btn = document.getElementById('btnSubmitDeal');
    btn.innerText = 'در حال پردازش...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: sellerPhone, nationalCode: nationalId })
      });
      const data = await res.json();

      if (!data.success) {
        alert(data.error || 'خطا در احراز هویت');
        btn.innerText = 'ایجاد لینک اختصاصی خرید امن';
        btn.disabled = false;
        return;
      }

      document.getElementById('otpDesc').innerText = `کد تایید به ${sellerPhone} ارسال شد (کد تستی فعلی: 1234):`;
      document.getElementById('otpModal').style.display = 'flex';
      btn.innerText = 'ایجاد لینک اختصاصی خرید امن';
      btn.disabled = false;
    } catch(e) {
      alert('خطا در ارتباط با سرور.');
      btn.innerText = 'ایجاد لینک اختصاصی خرید امن';
      btn.disabled = false;
    }
  }

  function closeOtpModal() {
    document.getElementById('otpModal').style.display = 'none';
  }

  async function verifyAndCreateDeal() {
    const code = document.getElementById('otpCodeInput').value.trim();
    const sellerPhone = document.getElementById('sellerPhone').value.trim();

    if (!code || code.length !== 4) {
      alert('کد ۴ رقمی را وارد کنید');
      return;
    }

    try {
      const verifyRes = await fetch('/api/otp', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: sellerPhone, code: code })
      });
      const verifyData = await verifyRes.json();

      if (!verifyData.success) {
        alert(verifyData.error || 'کد تایید اشتباه است');
        return;
      }

      localStorage.setItem('user_active_phone', sellerPhone);

      const dealPayload = {
        title: document.getElementById('dealTitle').value.trim(),
        amount: document.getElementById('dealAmount').value.trim(),
        seller_phone: sellerPhone,
        seller_national_id: document.getElementById('nationalIdInput').value.trim(),
        seller_sheba: document.getElementById('sellerSheba').value.trim(),
        fee_payer: document.getElementById('feePayer').value
      };

      const createRes = await fetch('/api/deals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dealPayload)
      });
      const createData = await createRes.json();

      if (createData.success && createData.dealId) {
        window.location.href = `/deal.html#${createData.dealId}`;
      } else {
        alert('خطا: ' + createData.error);
      }
    } catch(e) {
      alert('خطا در ثبت معامله');
    }
  }
</script>

</body>
</html>
